name: Branch Hygiene

# Keep the repository branch list limited to work that is actually still active.
#
# - After a same-repository PR is merged into main, delete its head branch.
# - On install/manual run, clean historical branches whose exact head was already
#   merged into main, plus explicitly documented superseded legacy branches.
# - Never delete main, protected branches, branches with an open PR, or unknown
#   branches with unique unmerged commits.
on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-hygiene.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged/superseded branches
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clean repository branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const closedPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'closed', per_page: 100 },
            );

            // One-time historical leftovers verified on 2026-09-30:
            // - PRs #439/#440 explicitly closed as superseded by merged #443.
            // - attribute-bonus-progression was replaced by merged #88.
            // - background-training-selection-ci* are stale CI retry branches
            //   from the implementation shipped by merged #84.
            const verifiedSuperseded = new Set([
              'agent/face-anchors-character-persist',
              'agent/face-mapping-close-zoom',
              'agent/preview-settings-nested-dropdown',
              'feat/attribute-bonus-progression',
              'feat/background-training-selection-ci',
              'feat/background-training-selection-ci2',
              'feat/background-training-selection-ci3',
              'feat/background-training-selection-ci4',
              'feat/background-training-selection-ci5',
            ]);

            const activeHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );

            const mergedHeadByBranch = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at) continue;
              if (pr.base.ref !== defaultBranch) continue;
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              const entries = mergedHeadByBranch.get(pr.head.ref) ?? [];
              entries.push(pr.head.sha);
              mergedHeadByBranch.set(pr.head.ref, entries);
            }

            const deleted = [];
            const kept = [];

            for (const branch of branches) {
              const name = branch.name;

              if (name === defaultBranch || branch.protected) {
                kept.push({ name, reason: name === defaultBranch ? 'default' : 'protected' });
                continue;
              }
              if (activeHeads.has(name)) {
                kept.push({ name, reason: 'open_pr' });
                continue;
              }

              const mergedHeads = mergedHeadByBranch.get(name) ?? [];
              const exactMergedHead = mergedHeads.includes(branch.commit.sha);

              let noUniqueCommits = false;
              if (!exactMergedHead && !verifiedSuperseded.has(name)) {
                try {
                  const compare = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${defaultBranch}...${name}`,
                  });
                  noUniqueCommits = compare.data.ahead_by === 0;
                } catch (error) {
                  core.warning(`Could not compare ${name}: ${error.message}`);
                }
              }

              if (!exactMergedHead && !noUniqueCommits && !verifiedSuperseded.has(name)) {
                kept.push({ name, reason: 'unique_unmerged_commits' });
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                deleted.push({
                  name,
                  reason: exactMergedHead
                    ? 'merged_pr'
                    : verifiedSuperseded.has(name)
                      ? 'verified_superseded'
                      : 'fully_contained_in_main',
                });
              } catch (error) {
                core.warning(`Could not delete ${name}: ${error.message}`);
                kept.push({ name, reason: 'delete_failed' });
              }
            }

            core.summary
              .addHeading('Branch hygiene')
              .addRaw(`Deleted: ${deleted.length}\n\n`)
              .addCodeBlock(JSON.stringify(deleted, null, 2), 'json')
              .addRaw(`\nKept: ${kept.length}\n\n`)
              .addCodeBlock(JSON.stringify(kept, null, 2), 'json');
            await core.summary.write();
