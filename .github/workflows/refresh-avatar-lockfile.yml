name: Refresh Avatar Lockfile

on:
  push:
    branches:
      - feat/character-studio-avatar
    paths:
      - .github/workflows/refresh-avatar-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/character-studio-avatar

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package manifest and lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact three@0.183.2 @pixiv/three-vrm@3.5.1
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @types/three@0.183.1

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: lock Three.js VRM runtime dependencies"
          git push
