name: Quality Gates

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Install dependencies
        run: npm ci

      - name: Run Test Gate
        run: npm run test-gate

  composition-gate:
    name: Composition Gate
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Composition Gate
        env:
          COMPOSITION_GATE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPOSITION_GATE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: npm run composition-gate
