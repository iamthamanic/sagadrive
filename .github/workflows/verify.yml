name: Quality Gates

# PRs: only pull_request (avoids duplicate push+PR runs that race and cancel each other).
# main: push after merge.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Install dependencies
        run: npm ci

      - name: Run Test Gate
        run: npm run test-gate

  composition-gate:
    name: Composition Gate
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Composition Gate
        env:
          COMPOSITION_GATE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPOSITION_GATE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: npm run composition-gate

  browser-e2e:
    name: Browser E2E
    needs: test-gate
    runs-on: ubuntu-latest
    # Suite ~8m; retries under load need headroom (was hitting 15m / flake races).
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qa/evidence/
            .qa/test-results/
            playwright-report/
          if-no-files-found: ignore
